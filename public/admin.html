<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Paneli - Çiftlik Foto</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <h1>Admin Paneli</h1>
      <nav>
        <a href="/">Ana Sayfa</a>
        <a href="/admin">Admin Paneli</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="form-section">
      <h2>Yeni Paylaşım Ekle</h2>

      <form id="postForm" class="post-form">
        <div class="form-group">
          <label for="title">Başlık</label>
          <input type="text" id="title" name="title" placeholder="Başlık gir..." required />
        </div>

        <div class="form-group">
          <label for="description">Açıklama</label>
          <textarea id="description" name="description" rows="5" placeholder="Açıklama gir..."></textarea>
        </div>

        <div class="form-group">
          <label for="images">Fotoğraflar</label>
          <input type="file" id="images" name="images" accept=".jpg,.jpeg,.png,.webp" multiple required />
          <small>En fazla 10 fotoğraf yükleyebilirsin.</small>
        </div>

        <button type="submit" class="btn">Paylaşımı Kaydet</button>
      </form>

      <div id="formMessage" class="form-message"></div>
    </section>
  </main>

  <script>
    const postForm = document.getElementById("postForm");
    const formMessage = document.getElementById("formMessage");

    postForm.addEventListener("submit", async function (e) {
      e.preventDefault();

      formMessage.textContent = "Yükleniyor...";
      formMessage.className = "form-message";

      const formData = new FormData();
      const title = document.getElementById("title").value;
      const description = document.getElementById("description").value;
      const imageFiles = document.getElementById("images").files;

      formData.append("title", title);
      formData.append("description", description);

      for (let i = 0; i < imageFiles.length; i++) {
        formData.append("images", imageFiles[i]);
      }

      try {
        const response = await fetch("/api/posts", {
          method: "POST",
          body: formData,
        });

        const result = await response.json();

        if (!response.ok) {
          throw new Error(result.message || "Bir hata oluştu.");
        }

        formMessage.textContent = "Paylaşım başarıyla eklendi.";
        formMessage.className = "form-message success";

        postForm.reset();
      } catch (error) {
        formMessage.textContent = error.message;
        formMessage.className = "form-message error";
      }
    });
  </script>
</body>
</html>
